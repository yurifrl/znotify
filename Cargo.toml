[package]
name = "zellij-notify"
version = "0.2.0"
edition = "2021"
authors = ["Yuri"]
description = "A Zellij plugin that adds status emojis to tabs and auto-cleans them on focus"
license = "MIT"
keywords = ["zellij", "plugin", "terminal", "wasm"]
categories = ["command-line-utilities"]

[lib]
crate-type = ["cdylib"]

[dependencies]
zellij-tile = "0.43.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
